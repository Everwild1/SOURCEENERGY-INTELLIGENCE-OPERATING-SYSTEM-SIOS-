name: Materialize Capitalization Control Plane

on:
  push:
    branches:
      - feat/capitalization-control-plane
    paths:
      - '.bootstrap/**'
      - '.github/workflows/capitalization-bootstrap.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/capitalization-bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/patch.part-* | base64 --decode | gzip --decompress > /tmp/capitalization.patch
          echo 'd668ea649fd38b3aa6e01ba4eae1d60cbe608b01514434f837b27e21760cbfc8  /tmp/capitalization.patch' | sha256sum --check --strict
          git apply --check /tmp/capitalization.patch
          git apply /tmp/capitalization.patch
      - name: Validate materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q setc/capitalization
          python -m unittest discover -s setc/capitalization/tests -p 'test_*.py' -v
          python setc/capitalization/artifact_checks.py
      - name: Replace bootstrap transport with implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/capitalization-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/capitalization-ci.yml docs/CAPITALIZATION_BLOCK_IMPLEMENTATION_EPIC.md setc/capitalization .bootstrap .github/workflows/capitalization-bootstrap.yml
          git commit -m 'CAP-E01-E10: materialize capitalization control plane'
          git push origin HEAD:feat/capitalization-control-plane
