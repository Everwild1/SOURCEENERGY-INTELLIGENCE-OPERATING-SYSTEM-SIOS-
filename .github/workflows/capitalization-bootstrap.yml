name: Materialize Capitalization Control Plane

on:
  push:
    branches:
      - feat/capitalization-control-plane
    paths:
      - '.bootstrap/**'
      - '.github/workflows/capitalization-bootstrap.yml'
      - 'setc/capitalization/**'
      - 'docs/CAPITALIZATION_BLOCK_IMPLEMENTATION_EPIC.md'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/capitalization-bootstrap.yml'
      - 'setc/capitalization/**'
      - 'docs/CAPITALIZATION_BLOCK_IMPLEMENTATION_EPIC.md'

permissions:
  contents: write

jobs:
  materialize-or-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Materialize implementation if absent
        shell: bash
        run: |
          set -euo pipefail
          if [ -f setc/capitalization/domain.py ]; then
            echo 'Capitalization implementation already materialized; skipping bootstrap patch.'
            exit 0
          fi
          cat .bootstrap/patch.part-* | base64 --decode | gzip --decompress > /tmp/capitalization.patch
          echo 'd668ea649fd38b3aa6e01ba4eae1d60cbe608b01514434f837b27e21760cbfc8  /tmp/capitalization.patch' | sha256sum --check --strict
          git apply --check /tmp/capitalization.patch
          git apply /tmp/capitalization.patch
      - name: Validate capitalization implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('setc/capitalization').rglob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
          python -B -m unittest discover -s setc/capitalization/tests -p 'test_*.py' -v
          python -B setc/capitalization/artifact_checks.py
      - name: Commit implementation when newly materialized
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/CAPITALIZATION_BLOCK_IMPLEMENTATION_EPIC.md setc/capitalization; then
            echo 'No materialization commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/CAPITALIZATION_BLOCK_IMPLEMENTATION_EPIC.md setc/capitalization
          git commit -m 'CAP-E01-E10: materialize capitalization control plane'
          git push origin HEAD:feat/capitalization-control-plane
