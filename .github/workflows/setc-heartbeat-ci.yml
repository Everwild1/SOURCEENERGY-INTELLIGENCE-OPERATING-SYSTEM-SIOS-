name: SETC HeartBeat CI

on:
  pull_request:
    paths:
      - 'setc/heartbeat/**'
      - 'tests/test_heartbeat*.py'
      - 'supabase/migrations/*heartbeat*.sql'
      - '.github/workflows/setc-heartbeat-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'setc/heartbeat/**'
      - 'tests/test_heartbeat*.py'
      - 'supabase/migrations/*heartbeat*.sql'
      - '.github/workflows/setc-heartbeat-ci.yml'

permissions:
  contents: read

jobs:
  heartbeat-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile HeartBeat domain
        run: python -m compileall -q setc/heartbeat
      - name: Run HeartBeat contract tests
        run: python -m pytest -q tests/test_heartbeat.py tests/test_heartbeat_continuity.py
      - name: Verify biometric migration guardrails
        run: |
          grep -R "enable row level security" supabase/migrations/*heartbeat*.sql
          grep -R "revoke all" supabase/migrations/*heartbeat*.sql
          grep -R "service_role" supabase/migrations/*heartbeat*.sql
          grep -R "Raw cardiac signals" supabase/migrations/*heartbeat*.sql
