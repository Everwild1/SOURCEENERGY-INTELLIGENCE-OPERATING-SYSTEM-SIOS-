name: AWS-03 CloudFormation Validation

on:
  pull_request:
    paths:
      - 'infra/aws/cloudformation/aws03-security-audit-baseline.yaml'
      - '.github/workflows/aws03-cloudformation-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: pip install cfn-lint

      - name: cfn-lint
        run: cfn-lint infra/aws/cloudformation/aws03-security-audit-baseline.yaml

      - name: Governance invariants
        shell: python
        run: |
          from pathlib import Path
          p = Path('infra/aws/cloudformation/aws03-security-audit-baseline.yaml')
          s = p.read_text()
          required = [
              'IsMultiRegionTrail: true',
              'IncludeGlobalServiceEvents: true',
              'EnableLogFileValidation: true',
              'IsLogging: true',
              'IncludeManagementEvents: true',
              'ReadWriteType: All',
              'ObjectLockEnabled: true',
              'Mode: GOVERNANCE',
              'BlockPublicAcls: true',
              'IgnorePublicAcls: true',
              'BlockPublicPolicy: true',
              'RestrictPublicBuckets: true',
              "aws:SecureTransport: 'false'",
              'EnableKeyRotation: true',
              'DeletionPolicy: Retain',
              'UpdateReplacePolicy: Retain',
          ]
          missing = [x for x in required if x not in s]
          forbidden = ['DataResources:', 'InsightSelectors:']
          present_forbidden = [x for x in forbidden if x in s]
          if missing or present_forbidden:
              raise SystemExit(f'missing={missing}; forbidden_present={present_forbidden}')
          print('AWS-03 governance invariants PASS')
