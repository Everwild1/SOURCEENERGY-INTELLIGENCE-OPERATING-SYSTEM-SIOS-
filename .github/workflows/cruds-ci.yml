name: CRUDS Universe CI

on:
  pull_request:
    paths:
      - 'setc/cruds/**'
      - 'tests/test_cruds_*.py'
      - '.github/workflows/cruds-ci.yml'
  push:
    branches: [main]
    paths:
      - 'setc/cruds/**'
      - 'tests/test_cruds_*.py'
      - '.github/workflows/cruds-ci.yml'

permissions:
  contents: read

jobs:
  cruds-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile CRUDS package
        run: python -m compileall -q setc/cruds
      - name: Run CRUDS tests
        run: python -m pytest -q tests/test_cruds_*.py
      - name: Guard Source Coin authority boundary
        run: |
          ! grep -R -E "(update|insert|delete).*(balance|ledger|treasury|supply)" setc/cruds --include='*.py' --include='*.sql' -i
      - name: Guard legal ownership claims
        run: |
          ! grep -R -E "confers[_ -]?legal[_ -]?(ip[_ -]?)?ownership[[:space:]]*=[[:space:]]*true" setc/cruds tests --include='*.py' --include='*.sql' -i
      - name: Guard WIM transaction authority
        run: |
          ! grep -R -E "(insert|update|delete)[[:space:]]+(into[[:space:]]+)?wim\.(transactions|settlement_requests|source_coin_events)" setc/cruds --include='*.sql' -i

  cruds-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: setc/cruds/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: setc/cruds/frontend/package-lock.json
      - name: Install pinned frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run E09 contract tests
        run: npm test
      - name: Build production frontend
        run: npm run build
      - name: Verify hosting package
        run: npm run test:sites
