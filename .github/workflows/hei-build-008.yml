name: HEI Build 008 Infrastructure Real Assets Contract

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260823010000_hei_build_001_identity_consortium_foundation.sql'
      - 'supabase/migrations/20260823020000_hei_build_002_endowment_fiduciary_core.sql'
      - 'supabase/migrations/20260823030000_hei_build_003_research_ip_commercialization.sql'
      - 'supabase/migrations/20260823040000_hei_build_004_capital_opportunity_core.sql'
      - 'supabase/migrations/20260823050000_hei_build_005_grants_philanthropy_mission_capital.sql'
      - 'supabase/migrations/20260823060000_hei_build_006_student_talent_mobility.sql'
      - 'supabase/migrations/20260823070000_hei_build_007_procurement_supplier_clusters.sql'
      - 'supabase/migrations/20260823080000_hei_build_008_infrastructure_real_assets.sql'
      - 'supabase/tests/hei_build_008.sql'
      - '.github/workflows/hei-build-008.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase role contracts
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
      - name: Apply HEI Waves 1-8
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823010000_hei_build_001_identity_consortium_foundation.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823020000_hei_build_002_endowment_fiduciary_core.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823030000_hei_build_003_research_ip_commercialization.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823040000_hei_build_004_capital_opportunity_core.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823050000_hei_build_005_grants_philanthropy_mission_capital.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823060000_hei_build_006_student_talent_mobility.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823070000_hei_build_007_procurement_supplier_clusters.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260823080000_hei_build_008_infrastructure_real_assets.sql
      - name: Run Wave 8 contract
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/hei_build_008.sql
