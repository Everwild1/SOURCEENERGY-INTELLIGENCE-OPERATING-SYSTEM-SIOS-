name: TST Full Regression & Readiness
on:
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/**','supabase/tests/tst_*.sql','docs/tst/**','.github/workflows/tst-full-regression-readiness.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres,POSTGRES_PASSWORD: postgres,POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    env: {PGHOST: localhost,PGPORT: 5432,PGUSER: postgres,PGPASSWORD: postgres,PGDATABASE: postgres}
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap contract database
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          DO $$ BEGIN
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END $$;
          SQL
      - name: Replay complete TST migration chain
        run: |
          set -e
          for f in \
            supabase/migrations/20260823010000_hei_build_001_identity_consortium_foundation.sql \
            supabase/migrations/20260823090000_tst_foundation_001.sql \
            supabase/migrations/20260823091000_tst_identity_rbac_002.sql \
            supabase/migrations/20260823092000_tst_stewardship_ledger_003.sql \
            supabase/migrations/20260823093000_tst_beneficiary_governance_004.sql \
            supabase/migrations/20260823094000_tst_distribution_treasury_005.sql \
            supabase/migrations/20260823095000_tst_evidence_audit_integrity_006.sql \
            supabase/migrations/20260823100000_tst_reporting_assurance_007.sql \
            supabase/migrations/20260823101000_tst_oversight_compliance_008.sql; do
              psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run complete TST contract suite
        run: |
          set -e
          for f in $(find supabase/tests -maxdepth 1 -type f -name 'tst_*.sql' | sort); do
            echo "Running $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Security posture assertions
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ DECLARE leaks integer; BEGIN
            SELECT count(*) INTO leaks FROM information_schema.role_table_grants
            WHERE table_schema='tst' AND grantee IN ('anon','authenticated');
            IF leaks<>0 THEN RAISE EXCEPTION 'TST direct client grants detected: %',leaks; END IF;
            IF EXISTS(SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='tst' AND c.relkind='r' AND NOT c.relrowsecurity) THEN
              RAISE EXCEPTION 'TST table without RLS detected';
            END IF;
          END $$;
          SQL
