name: Media Communications Contract

on:
  pull_request:
    paths:
      - 'docs/media-communications/**'
      - 'contracts/media-communications/**'
      - 'supabase/tests/database/media_*.sql'
      - '.github/workflows/media-communications-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required Media contract controls
        shell: bash
        run: |
          set -euo pipefail
          contract='contracts/media-communications/ci-contract.txt'
          docs='docs/media-communications/README.md'
          test -s "$contract"
          test -s "$docs"
          required=(
            'REQUIRED_GUARD=setc_media_publication_ready'
            'REQUIRED_COMMAND=setc_media_transition'
            'REQUIRED_COMMAND=setc_media_publish'
            'REQUIRED_COMMAND=setc_media_emit_event'
            'REQUIRED_COMMAND=setc_media_enqueue_outbox'
            'REQUIRED_RULE=generic-transition-must-not-publish'
            'REQUIRED_RULE=publish-requires-media.publish'
            'REQUIRED_RULE=publish-requires-publication-ready'
            'REQUIRED_RULE=material-claims-require-evidence'
            'REQUIRED_RULE=cross-organization-access-denied'
            'REQUIRED_RULE=outbox-idempotency-required'
            'REQUIRED_RULE=delivery-does-not-create-authority'
          )
          for item in "${required[@]}"; do
            grep -Fxq "$item" "$contract" || { echo "Missing contract control: $item"; exit 1; }
          done
          grep -Fq 'setc_media_publish' "$docs"
          grep -Fq 'setc_media_publication_ready' "$docs"
          grep -Fq 'idempot' "$docs"
      - name: Enforce no production identity assignment in contract PR
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'INSERT[[:space:]]+INTO[[:space:]]+media_access\.(user_roles|assignments)' docs/media-communications contracts/media-communications 2>/dev/null; then
            echo 'Production Media identity/role assignment detected in contract-only paths.'
            exit 1
          fi
      - name: Emit contract verification summary
        run: |
          echo 'Media Communications contract controls verified.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Publication must use governed publish command.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Publication readiness and media.publish authority are mandatory.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Outbox idempotency and institutional-truth boundary are mandatory.' >> "$GITHUB_STEP_SUMMARY"

  database-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install pgTAP
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client postgresql-15-pgtap
      - name: Load deterministic Media authorization fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/media_auth_fixture.sql
      - name: Enable pgTAP
        run: psql -v ON_ERROR_STOP=1 -c 'create extension if not exists pgtap;'
      - name: Execute Media RLS contract
        run: pg_prove --ext .sql supabase/tests/database/media_auth_rls.test.sql
      - name: Emit database verification summary
        run: |
          echo 'Media database authorization contract executed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Synthetic principals only; no production Auth users provisioned.' >> "$GITHUB_STEP_SUMMARY"
          echo '- RLS and separated Media permissions verified at database-test layer.' >> "$GITHUB_STEP_SUMMARY"
