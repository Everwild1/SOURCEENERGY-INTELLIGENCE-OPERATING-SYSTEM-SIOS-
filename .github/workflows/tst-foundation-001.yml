name: TST Foundation 001 Database Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/tst/**'
      - 'supabase/migrations/20260823090000_tst_foundation_001.sql'
      - 'supabase/tests/tst_foundation_001.sql'
      - '.github/workflows/tst-foundation-001.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tst-foundation-db-contract:
    name: TST foundation DB contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify PostgreSQL client
        run: psql --version

      - name: Create Supabase role contract
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          SQL

      - name: Apply canonical SETC organization contract
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260823010000_hei_build_001_identity_consortium_foundation.sql

      - name: Apply TST foundation migration
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260823090000_tst_foundation_001.sql

      - name: Run TST foundation contract tests
        run: |
          psql -v ON_ERROR_STOP=1 \
            -f supabase/tests/tst_foundation_001.sql

      - name: Verify RLS foundation
        run: |
          psql -v ON_ERROR_STOP=1 -Atc "
            SELECT CASE
              WHEN count(*) = 6 AND count(*) FILTER (WHERE c.relrowsecurity) = 6
              THEN 'tst_foundation_rls_ok'
              ELSE 'tst_foundation_rls_failed'
            END
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'tst'
              AND c.relname = ANY(ARRAY['stewardship_entities','funds','roles','permissions','role_permissions','feature_flags']);
          " | grep -qx 'tst_foundation_rls_ok'
