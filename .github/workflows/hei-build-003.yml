name: HEI Build 003 Research Commercialization Contract
on:
  pull_request:
    branches: [main]
    paths: ['supabase/migrations/20260823030000_hei_build_003_research_ip_commercialization.sql','supabase/tests/hei_build_003.sql','.github/workflows/hei-build-003.yml']
  push:
    branches: ['feat/hei-build-003']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hei-build-003-db-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=10
    env: {PGHOST: localhost, PGPORT: 5432, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres}
    steps:
      - uses: actions/checkout@v4
      - name: Create Supabase role contracts
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;"
      - name: Apply Waves 1-3
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260823010000_hei_build_001_identity_consortium_foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260823020000_hei_build_002_endowment_fiduciary_core.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260823030000_hei_build_003_research_ip_commercialization.sql
      - name: Run Wave 3 contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/hei_build_003.sql
