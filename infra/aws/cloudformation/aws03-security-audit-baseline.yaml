AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  SourceEnergy AWS-03 security audit baseline — establishes a dedicated encrypted multi-region CloudTrail path with CloudWatch visibility while preserving existing Phase-1 governance buckets.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: multi-region management-event CloudTrail -> CMK-encrypted S3 + CloudWatch Logs; access logs -> existing Phase-1 access-log bucket
    must:
      - Do not replace or weaken existing Phase-1 audit, evidence, or DR buckets
      - Management events only in AWS-03 baseline; data events and Insights require separate cost/governance approval
      - Trail must cover all enabled regions and global service events
      - CloudTrail log-file validation must remain enabled
    owner: SourceEnergy SIOS

Parameters:
  ExistingAccessLogBucketName:
    Type: String
    Default: sourceenergy-phase1-accesslogbucket-wour7fttzss1
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Existing Phase-1 access-log bucket used as the server-access-log destination.
  CloudWatchRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 120, 150, 180, 365]
    Description: CloudWatch Logs retention for CloudTrail management events.
  ObjectLockRetentionDays:
    Type: Number
    Default: 90
    MinValue: 7
    MaxValue: 3650
    Description: Governance-mode Object Lock retention for CloudTrail S3 objects.

Resources:
  CloudTrailKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: dedicated CMK isolates CloudTrail encryption from Phase-1 evidence/audit keys and gives CloudTrail explicit least-privilege key use
        must:
          - Key policy must retain account administration and CloudTrail GenerateDataKey/DescribeKey access
          - CloudTrail use must be scoped by SourceArn and encryption context
        mutable: review-required
    Properties:
      Description: SourceEnergy AWS-03 CloudTrail encryption key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudTrailDescribeKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:DescribeKey
            Resource: '*'
          - Sid: AllowCloudTrailGenerateDataKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:GenerateDataKey*
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*
      Tags:
        - Key: System
          Value: SourceEnergy
        - Key: Control
          Value: AWS-03
        - Key: DataClass
          Value: Audit

  CloudTrailKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-cloudtrail
      TargetKeyId: !Ref CloudTrailKey

  CloudTrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: dedicated CloudTrail log store avoids changing Phase-1 audit/evidence bucket semantics; retains logs under versioning + governance Object Lock
        must:
          - Public access blocks must stay enabled
          - BucketOwnerEnforced ownership and TLS-only policy must remain
          - Default encryption must remain on dedicated CloudTrail CMK
          - Object Lock + versioning must remain enabled
        mutable: change-with-constraints
        mutability:
          ObjectLockEnabled: must-never-change
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CloudTrailKey.Arn
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: !Ref ObjectLockRetentionDays
      LoggingConfiguration:
        DestinationBucketName: !Ref ExistingAccessLogBucketName
        LogFilePrefix: !Sub cloudtrail/${AWS::StackName}/
      LifecycleConfiguration:
        Rules:
          - Id: CloudTrailArchiveLifecycle
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
              - StorageClass: GLACIER
                TransitionInDays: 90
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 365
      Tags:
        - Key: System
          Value: SourceEnergy
        - Key: Control
          Value: AWS-03
        - Key: DataClass
          Value: Audit

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: permits only scoped CloudTrail delivery and denies non-TLS access without widening public access
        must:
          - Keep SourceAccount and SourceArn conditions on CloudTrail service access
          - Keep aws:SecureTransport deny
        mutable: review-required
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt CloudTrailBucket.Arn
              - !Sub ${CloudTrailBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${CloudTrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail

  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: near-real-time management-event visibility for root/IAM/configuration monitoring; S3 remains durable audit store
        must:
          - Retention must be explicitly bounded
        mutable: free-to-tune
    Properties:
      LogGroupName: !Sub /sourceenergy/aws03/cloudtrail/${AWS::StackName}
      RetentionInDays: !Ref CloudWatchRetentionDays
      KmsKeyId: !GetAtt CloudTrailKey.Arn

  CloudTrailCloudWatchRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: dedicated least-privilege role lets CloudTrail publish only to the AWS-03 log group
        must:
          - Trust only cloudtrail.amazonaws.com
          - Log permissions stay scoped to the AWS-03 log stream ARN
        mutable: review-required
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailToCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${CloudTrailLogGroup.Arn}:*
      Tags:
        - Key: System
          Value: SourceEnergy
        - Key: Control
          Value: AWS-03

  MultiRegionTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - CloudTrailBucketPolicy
      - CloudTrailLogGroup
      - CloudTrailCloudWatchRole
    Metadata:
      com.aws.cloudformation.Context:
        why: account-wide management-event audit trail across regions; data events/Insights intentionally deferred pending cost + governance approval
        must:
          - IsMultiRegionTrail true
          - IncludeGlobalServiceEvents true
          - EnableLogFileValidation true
          - IsLogging true
          - Management events remain enabled for reads + writes
        mutable: change-with-constraints
    Properties:
      TrailName: !Sub ${AWS::StackName}-trail
      S3BucketName: !Ref CloudTrailBucket
      KMSKeyId: !GetAtt CloudTrailKey.Arn
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      IsLogging: true
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailCloudWatchRole.Arn
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All
      Tags:
        - Key: System
          Value: SourceEnergy
        - Key: Control
          Value: AWS-03
        - Key: Environment
          Value: governance

Outputs:
  TrailArn:
    Description: ARN of the SourceEnergy AWS-03 multi-region CloudTrail trail.
    Value: !GetAtt MultiRegionTrail.Arn
  TrailName:
    Description: Name of the SourceEnergy AWS-03 multi-region CloudTrail trail.
    Value: !Ref MultiRegionTrail
  CloudTrailBucketName:
    Description: Dedicated retained S3 bucket receiving CloudTrail logs.
    Value: !Ref CloudTrailBucket
  CloudTrailKeyArn:
    Description: Dedicated customer-managed KMS key for CloudTrail encryption.
    Value: !GetAtt CloudTrailKey.Arn
  CloudWatchLogGroupName:
    Description: CloudWatch log group receiving CloudTrail management events.
    Value: !Ref CloudTrailLogGroup
